services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadengine
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/leadengine
      REDIS_URL: redis://redis:6379/0
      MCP_WEB_SEARCH_URL: http://mcp-web-search:8000/mcp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-web-search:
        condition: service_started
    mem_limit: 512m
    cpus: "1.0"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/leadengine
      REDIS_URL: redis://redis:6379/0
      MCP_WEB_SEARCH_URL: http://mcp-web-search:8000/mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-web-search:
        condition: service_started
    command: /app/.venv/bin/arq workers.worker.WorkerSettings
    mem_limit: 512m
    cpus: "1.0"

  mcp-web-search:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "8000"
    command: /app/.venv/bin/python -m mcp_servers.web_search.server
    mem_limit: 256m
    cpus: "0.5"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: harshitagrawal.jhansi@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: c92cd6817ae471ff07520d8c059ece027d81b69535196dfd03fcfddc7f7b8086
      SALT: bed6c7ee83a0f82f6342fa7a930849816bb8ab071f3fcace612c219c16ecf4c7

volumes:
  postgres_data:
  redis_data:
